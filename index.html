<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c22">
<title>ポケカ資産＆抽選</title>
<style>
  :root{
    --bg:#141419; --card:#1f1f27; --card2:#26262f; --line:#33333f;
    --text:#f2f2f5; --muted:#9a9aa6; --accent:#ffd23f; --plus:#4ade80; --minus:#f87171;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN",system-ui,sans-serif; font-size:15px}
  header{position:sticky; top:0; background:var(--bg); z-index:10; padding:10px 12px 0}
  .title-tabs{display:flex; gap:8px}
  .title-tab{flex:1; text-align:center; padding:9px; border-radius:10px 10px 0 0;
    background:var(--card); color:var(--muted); font-weight:700; border:1px solid var(--line); border-bottom:none}
  .title-tab.active{background:var(--card2); color:var(--text)}
  .title-tab.soon{opacity:.55}
  nav{display:flex; gap:6px; padding:10px 12px; position:sticky; top:52px; background:var(--bg); z-index:10}
  nav button{flex:1; padding:9px 0; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--muted); font-size:14px}
  nav button.active{background:var(--accent); color:#191900; font-weight:700; border-color:var(--accent)}
  main{padding:4px 12px 90px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
  .big{font-size:30px; font-weight:800; letter-spacing:.5px}
  .muted{color:var(--muted); font-size:12px}
  .plus{color:var(--plus)} .minus{color:var(--minus)}
  .row{display:flex; align-items:center; gap:8px}
  .grow{flex:1}
  .seg{display:flex; gap:6px; margin:8px 0}
  .seg button{padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card2); color:var(--muted)}
  .seg button.active{color:var(--text); border-color:var(--accent)}
  svg.chart{width:100%; height:180px; display:block}
  .item{border-top:1px solid var(--line); padding:10px 0}
  .item:first-child{border-top:none}
  .tag{display:inline-block; font-size:11px; padding:2px 7px; border-radius:999px; background:var(--card2); color:var(--muted); margin-right:4px}
  .grade{color:#191900; background:var(--accent); font-weight:800}
  input,select,textarea{width:100%; padding:10px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:15px; margin-bottom:8px}
  label{font-size:12px; color:var(--muted); display:block; margin:6px 0 3px}
  .btn{width:100%; padding:12px; border:none; border-radius:12px; background:var(--accent);
    color:#191900; font-weight:800; font-size:15px}
  .btn.sub{background:var(--card2); color:var(--text); border:1px solid var(--line)}
  .btn.small{width:auto; padding:7px 12px; font-size:13px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .count-btn{width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:20px}
  .pill{font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--card2)}
  .pill.on{border-color:var(--accent); color:var(--accent)}
  .hidden{display:none}
  a{color:var(--accent)}
  .photo-preview{width:100%; border-radius:10px; margin:8px 0}
  .cand{width:100%; text-align:left; padding:10px; margin-bottom:6px; border-radius:10px;
    border:1px solid var(--line); background:var(--card2); color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="title-tabs">
    <div class="title-tab active" id="tab-pokeka">ポケカ</div>
    <div class="title-tab soon" id="tab-onepiece">ワンピース（準備中）</div>
  </div>
  <div class="muted" style="padding:5px 2px 7px">β版（ベータ） v0.1 — 価格の自動取得は順次有効化中。台帳・抽選・グラフは利用できます</div>
</header>
<nav>
  <button data-view="home" class="active">ホーム</button>
  <button data-view="ledger">台帳</button>
  <button data-view="lottery">抽選</button>
  <button data-view="packs">バラパック</button>
</nav>
<main>
  <!-- ホーム -->
  <section id="view-home">
    <div class="card">
      <div class="muted">合計資産額（今売れる価格ベース）</div>
      <div class="big" id="total-value">—</div>
      <div class="row">
        <span class="muted">含み損益</span><span id="total-pl">—</span>
        <span class="grow"></span>
        <span class="muted" id="price-updated"></span>
      </div>
    </div>
    <div class="card">
      <div class="row"><div class="grow" style="font-weight:700">資産推移</div>
        <div class="seg" id="period-seg">
          <button data-p="7">週</button><button data-p="30" class="active">月</button><button data-p="0">全期間</button>
        </div>
      </div>
      <svg class="chart" id="chart" viewBox="0 0 320 180" preserveAspectRatio="none"></svg>
      <div id="chart-detail" class="muted">グラフの点をタップすると、その日の品目別プラマイが出ます</div>
    </div>
    <div class="card">
      <div style="font-weight:700; margin-bottom:6px">締切が近い抽選</div>
      <div id="home-lotteries"></div>
    </div>
    <div class="card">
      <div style="font-weight:700; margin-bottom:6px">新商品</div>
      <div id="home-products"></div>
    </div>
  </section>

  <!-- 台帳 -->
  <section id="view-ledger" class="hidden">
    <div class="card">
      <div style="font-weight:700; margin-bottom:8px">写真から登録</div>
      <div class="grid2">
        <button class="btn sub" id="btn-camera">📷 撮影する</button>
        <button class="btn sub" id="btn-library">🖼 写真フォルダ</button>
      </div>
      <input type="file" id="file-camera" accept="image/*" capture="environment" class="hidden">
      <input type="file" id="file-library" accept="image/*" class="hidden">
      <img id="photo-preview" class="photo-preview hidden" alt="">
      <div id="ocr-status" class="muted"></div>
      <div id="candidates"></div>
    </div>
    <div class="card">
      <div style="font-weight:700; margin-bottom:4px">登録フォーム</div>
      <label>種類</label>
      <select id="f-type">
        <option value="single">シングルカード</option>
        <option value="box">未開封ボックス</option>
        <option value="set">デッキセット等</option>
      </select>
      <label>マスターから選ぶ（検索）</label>
      <input id="f-master-search" placeholder="名前・型番で検索">
      <select id="f-master"></select>
      <label>名前（マスターに無い場合は直接入力）</label>
      <input id="f-name" placeholder="カード名／商品名">
      <div class="grid2">
        <div><label>型番・弾</label><input id="f-number" placeholder="例 123/456"></div>
        <div><label>レアリティ</label><input id="f-rarity" placeholder="例 SR"></div>
      </div>
      <div class="grid2">
        <div><label>状態</label>
          <select id="f-condition"><option>美品</option><option>良品</option><option>傷あり</option><option>未開封</option></select></div>
        <div><label>鑑定グレード</label>
          <select id="f-grade">
            <option value="">なし（生カード）</option>
            <option>PSA10</option><option>PSA9</option><option>PSA8</option><option>PSA7</option>
            <option>PSA6</option><option>PSA5以下</option><option>CGC10</option><option>CGC9.5以下</option>
          </select></div>
      </div>
      <div class="grid2">
        <div><label>認定番号（鑑定品）</label><input id="f-cert" placeholder="ラベルの番号"></div>
        <div><label>シュリンク（ボックス）</label>
          <select id="f-shrink"><option value="">—</option><option>有り</option><option>無し</option></select></div>
      </div>
      <div class="grid2">
        <div><label>個数・枚数</label><input id="f-qty" type="number" min="1" value="1"></div>
        <div><label>購入価格（1個あたり・円）</label><input id="f-buy" type="number" min="0" placeholder="0"></div>
      </div>
      <div class="grid2">
        <div><label>購入日</label><input id="f-date" type="date"></div>
        <div><label>現在価格の手入力（任意）</label><input id="f-manual" type="number" min="0" placeholder="自動取得できない品目用"></div>
      </div>
      <button class="btn" id="btn-add">台帳に追加</button>
    </div>
    <div class="card">
      <div style="font-weight:700; margin-bottom:8px">絞り込み</div>
      <div class="grid2">
        <select id="q-type"><option value="">種類：すべて</option><option value="single">シングル</option><option value="box">ボックス</option><option value="set">セット</option></select>
        <select id="q-grade"><option value="">グレード：すべて</option><option>PSA10</option><option>PSA9</option><option>PSA8</option><option>PSA7</option><option>PSA6</option><option>PSA5以下</option><option value="none">鑑定なし</option></select>
      </div>
      <div class="grid2">
        <input id="q-text" placeholder="名前・型番で検索">
        <select id="q-pl"><option value="">損益：すべて</option><option value="plus">含み益のみ</option><option value="minus">含み損のみ</option></select>
      </div>
      <div class="muted" id="ledger-summary"></div>
    </div>
    <div class="card"><div id="ledger-list"></div></div>
  </section>

  <!-- 抽選 -->
  <section id="view-lottery" class="hidden">
    <div class="card">
      <label>エリアで絞り込み</label>
      <select id="lot-area"></select>
      <label>自分の地域（この地域の抽選を優先表示）</label>
      <select id="my-area"></select>
    </div>
    <div class="card"><div id="lottery-list"></div></div>
  </section>

  <!-- バラパック -->
  <section id="view-packs" class="hidden">
    <div class="card">
      <div style="font-weight:700">バラパック ストック</div>
      <div class="muted">資産には含めません。開封・購入のたびに＋／−で調整してください。</div>
    </div>
    <div class="card"><div id="pack-list"></div></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
"use strict";
/* ============ データ読み込み ============ */
const AREAS = ["全国","大手通販サイト","大手カードショップ","札幌","宮城（山形・福島含む）","埼玉","千葉","東京","神奈川","愛知（三重・岐阜含む）","大阪（京都・兵庫・奈良・和歌山含む）","広島","福岡（佐賀・大分・熊本含む）"];
let MASTER = {singles:[],boxes:[],sets:[],packs:[]};
let PRICES = {items:{}, updated_at:null};
let LOTTERIES = [];
let PRODUCTS = [];
async function loadData(){
  const get = async (p, fb) => { try{ const r = await fetch(p); if(!r.ok) throw 0; return await r.json(); }catch(e){ return fb; } };
  MASTER = await get("data/master.json", MASTER);
  // v0.3: 画像URLは data/images.json に分離配信 (master.json の転送サイズ上限対策)。取得失敗時は画像なしで継続する
  const im = await get("data/images.json", null);
  if (im && im.items && Array.isArray(MASTER.singles)){
    const byId = {}; MASTER.singles.forEach(s => { byId[s.id] = s; });
    for (const id in im.items){ const s = byId[id]; if (s) s.image = im.items[id]; }
  }
  const pr = await get("data/prices.json", PRICES); PRICES = pr;
  const lo = await get("data/lotteries.json", {items:[]}); LOTTERIES = lo.items || [];
  const pd = await get("data/products.json", {items:[]}); PRODUCTS = pd.items || [];
}
/* ============ 端末保存 ============ */
const store = {
  get(k, fb){ try{ const v = localStorage.getItem("pk_"+k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } },
  set(k, v){ localStorage.setItem("pk_"+k, JSON.stringify(v)); }
};
let assets   = store.get("assets", []);      // [{id,type,masterId,name,number,rarity,condition,grade,cert,shrink,qty,buy,date,manual}]
let snaps    = store.get("snapshots", []);   // [{date,total,items:{assetId:value}}]
let lotState = store.get("lottery", {});     // {lotteryId: "未応募"|"応募済み"|"当選"|"落選"}
let packCnt  = store.get("packs", {});       // {packId: count}
let myArea   = store.get("myArea", "");
const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
const todayStr = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

/* ============ 評価額 ============ */
function priceOf(a){
  const p = a.masterId ? PRICES.items[a.masterId] : null;
  if (a.grade && p && p.psa){
    const g = a.grade.replace("PSA","").replace("CGC","");
    const key = g === "5以下" ? "low" : g;
    if (p.psa[key] != null) return {value:p.psa[key], src:"鑑定買取("+a.grade+")"};
    if (p.psa["10"] != null && a.grade === "PSA10") return {value:p.psa["10"], src:"PSA10買取"};
  }
  if (p){
    const cand = [];
    if (p.buyback != null) cand.push(p.buyback);
    if (p.flea != null) cand.push(p.flea);
    if (cand.length) return {value: cand.reduce((s,v)=>s+v,0)/cand.length, src:"買取/実績"};
    if (p.sale != null) return {value:p.sale, src:"販売価格"};
  }
  if (a.manual != null && a.manual !== "") return {value:Number(a.manual), src:"手入力"};
  return {value:null, src:"価格未取得"};
}
function assetValue(a){ const p = priceOf(a); return p.value == null ? null : p.value * (a.qty||1); }
function totals(){
  let val = 0, cost = 0, unknown = 0;
  for (const a of assets){
    const v = assetValue(a);
    cost += (a.buy||0) * (a.qty||1);
    if (v == null) unknown++; else val += v;
  }
  return {val, cost, pl: val - cost, unknown};
}
/* その日のスナップショットを1回だけ記録 */
function takeSnapshot(){
  const t = totals(); if (!assets.length) return;
  const d = todayStr();
  const items = {};
  for (const a of assets){ const v = assetValue(a); if (v != null) items[a.id] = v; }
  const ex = snaps.find(s => s.date === d);
  if (ex){ ex.total = t.val; ex.items = items; }
  else snaps.push({date:d, total:t.val, items});
  snaps.sort((a,b)=> a.date < b.date ? -1 : 1);
  store.set("snapshots", snaps);
}
</script>
<script>
"use strict";
/* ============ 画面切替 ============ */
document.querySelectorAll("nav button").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    ["home","ledger","lottery","packs"].forEach(v=>{
      document.getElementById("view-"+v).classList.toggle("hidden", v !== b.dataset.view);
    });
  });
});
document.getElementById("tab-onepiece").addEventListener("click", ()=> alert("ワンピースカードは、ポケカ完成後に別タブで追加予定です"));

/* ============ ホーム ============ */
let period = 30;
document.querySelectorAll("#period-seg button").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll("#period-seg button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); period = Number(b.dataset.p); drawChart();
  });
});
function renderHome(){
  const t = totals();
  document.getElementById("total-value").textContent = assets.length ? yen(t.val) : "¥0";
  const pl = document.getElementById("total-pl");
  pl.textContent = assets.length ? (t.pl >= 0 ? "+" : "") + yen(t.pl) + (t.unknown ? `（価格未取得 ${t.unknown}件）` : "") : "台帳に登録すると表示されます";
  pl.className = t.pl >= 0 ? "plus" : "minus";
  document.getElementById("price-updated").textContent = PRICES.updated_at ? "価格データ: " + PRICES.updated_at : "";
  drawChart();
  const now = Date.now();
  const upcoming = LOTTERIES
    .filter(l => l.apply_end && new Date(l.apply_end).getTime() > now)
    .sort((a,b)=> new Date(a.apply_end) - new Date(b.apply_end)).slice(0,3);
  document.getElementById("home-lotteries").innerHTML = upcoming.length
    ? upcoming.map(l => `<div class="item"><div>${l.shop}：${l.product}</div><div class="muted">締切 ${fmtDT(l.apply_end)}（${remain(l.apply_end)}）</div></div>`).join("")
    : "<div class='muted'>受付中の抽選はありません</div>";
  document.getElementById("home-products").innerHTML = PRODUCTS.length
    ? PRODUCTS.map(p => `<div class="item"><div>${p.name}</div><div class="muted">${p.kind||""}${p.release ? "／発売 "+p.release : ""}${p.list_price ? "／定価 "+yen(p.list_price) : ""}</div></div>`).join("")
    : "<div class='muted'>新商品情報はありません</div>";
}
function drawChart(){
  const svg = document.getElementById("chart");
  const data = period ? snaps.slice(-period) : snaps.slice();
  if (data.length < 1){ svg.innerHTML = '<text x="10" y="90" fill="#9a9aa6" font-size="12">データが貯まるとグラフが出ます</text>'; return; }
  const vals = data.map(s=>s.total);
  const min = Math.min(...vals), max = Math.max(...vals);
  const pad = (max - min) * 0.15 || 100;
  const lo = min - pad, hi = max + pad;
  const X = i => data.length === 1 ? 160 : 14 + i * (292 / (data.length - 1));
  const Y = v => 160 - (v - lo) / (hi - lo) * 140;
  let html = "";
  data.forEach((s,i)=>{ if(i) html += `<line x1="${X(i-1)}" y1="${Y(data[i-1].total)}" x2="${X(i)}" y2="${Y(s.total)}" stroke="#ffd23f" stroke-width="2"/>`; });
  data.forEach((s,i)=>{ html += `<circle cx="${X(i)}" cy="${Y(s.total)}" r="7" fill="#ffd23f" data-i="${i}" style="cursor:pointer"><title>${s.date}</title></circle>`; });
  html += `<text x="14" y="14" fill="#9a9aa6" font-size="10">${yen(max)}</text><text x="14" y="176" fill="#9a9aa6" font-size="10">${data[0].date} 〜 ${data[data.length-1].date}</text>`;
  svg.innerHTML = html;
  svg.querySelectorAll("circle").forEach(c=>{
    c.addEventListener("click", ()=> showDay(data[Number(c.dataset.i)], data));
  });
}
function showDay(snap, data){
  const idx = data.indexOf(snap);
  const prev = idx > 0 ? data[idx-1] : null;
  const rows = assets.map(a=>{
    const v = snap.items[a.id]; if (v == null) return null;
    const pv = prev && prev.items[a.id] != null ? prev.items[a.id] : null;
    return {name: a.name, grade: a.grade, v, diff: pv == null ? null : v - pv};
  }).filter(Boolean).sort((x,y)=> Math.abs(y.diff||0) - Math.abs(x.diff||0));
  document.getElementById("chart-detail").innerHTML =
    `<div style="color:var(--text); font-size:14px; margin-top:6px">${snap.date} の内訳（合計 ${yen(snap.total)}）</div>` +
    (rows.length ? rows.map(r=>`<div class="item row"><span class="grow">${r.name}${r.grade ? ` <span class="tag grade">${r.grade}</span>` : ""}</span><span>${yen(r.v)}</span><span class="${r.diff==null?"":(r.diff>=0?"plus":"minus")}" style="min-width:76px; text-align:right">${r.diff==null?"—":(r.diff>=0?"+":"")+yen(r.diff)}</span></div>`).join("")
    : "<div class='muted'>この日の品目データはありません</div>");
}
function fmtDT(iso){ const d = new Date(iso); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function remain(iso){
  const ms = new Date(iso).getTime() - Date.now(); if (ms < 0) return "終了";
  const h = Math.floor(ms/36e5); return h >= 24 ? `あと${Math.floor(h/24)}日` : `あと${h}時間`;
}

/* ============ 台帳 ============ */
const masterAll = () => [
  ...MASTER.singles.map(m=>({...m, _t:"single"})),
  ...MASTER.boxes.map(m=>({...m, _t:"box"})),
  ...MASTER.sets.map(m=>({...m, _t:"set"}))
];
function fillMaster(){
  const q = document.getElementById("f-master-search").value.trim();
  const sel = document.getElementById("f-master");
  const list = masterAll().filter(m => !q || (m.name||"").includes(q) || (m.number||"").includes(q));
  sel.innerHTML = '<option value="">（マスター未選択）</option>' + list.map(m=>`<option value="${m.id}">${m.name}${m.number ? "（"+m.number+"）" : ""}</option>`).join("");
}
document.getElementById("f-master-search").addEventListener("input", fillMaster);
document.getElementById("f-master").addEventListener("change", e=>{
  const m = masterAll().find(x=>x.id === e.target.value); if (!m) return;
  document.getElementById("f-name").value = m.name || "";
  document.getElementById("f-number").value = m.number || "";
  document.getElementById("f-rarity").value = m.rarity || "";
  document.getElementById("f-type").value = m._t;
});
document.getElementById("btn-add").addEventListener("click", ()=>{
  const name = document.getElementById("f-name").value.trim();
  if (!name) return alert("名前を入れてください");
  assets.push({
    id: "a" + Date.now(),
    type: document.getElementById("f-type").value,
    masterId: document.getElementById("f-master").value || null,
    name,
    number: document.getElementById("f-number").value.trim(),
    rarity: document.getElementById("f-rarity").value.trim(),
    condition: document.getElementById("f-condition").value,
    grade: document.getElementById("f-grade").value,
    cert: document.getElementById("f-cert").value.trim(),
    shrink: document.getElementById("f-shrink").value,
    qty: Math.max(1, Number(document.getElementById("f-qty").value) || 1),
    buy: Number(document.getElementById("f-buy").value) || 0,
    date: document.getElementById("f-date").value,
    manual: document.getElementById("f-manual").value
  });
  store.set("assets", assets); takeSnapshot(); renderLedger(); renderHome();
  alert("台帳に追加しました");
});
function filteredAssets(){
  const t = document.getElementById("q-type").value;
  const g = document.getElementById("q-grade").value;
  const q = document.getElementById("q-text").value.trim();
  const pl = document.getElementById("q-pl").value;
  return assets.filter(a=>{
    if (t && a.type !== t) return false;
    if (g === "none" && a.grade) return false;
    if (g && g !== "none" && a.grade !== g) return false;
    if (q && !(a.name.includes(q) || (a.number||"").includes(q))) return false;
    if (pl){ const v = assetValue(a); if (v == null) return false; const d = v - (a.buy||0)*(a.qty||1); if (pl === "plus" && d < 0) return false; if (pl === "minus" && d >= 0) return false; }
    return true;
  });
}
function renderLedger(){
  const list = filteredAssets();
  let sum = 0;
  for (const a of list){ const v = assetValue(a); if (v != null) sum += v; }
  document.getElementById("ledger-summary").textContent = `${list.length}件／合計評価額 ${yen(sum)}`;
  document.getElementById("ledger-list").innerHTML = list.length ? list.map(a=>{
    const p = priceOf(a), v = assetValue(a);
    const d = v == null ? null : v - (a.buy||0)*(a.qty||1);
    return `<div class="item">
      <div class="row"><span class="grow" style="font-weight:700">${a.name}</span>
      <button class="pill" data-del="${a.id}">削除</button></div>
      <div>
        ${a.grade ? `<span class="tag grade">${a.grade}</span>` : ""}
        ${a.rarity ? `<span class="tag">${a.rarity}</span>` : ""}
        ${a.number ? `<span class="tag">${a.number}</span>` : ""}
        <span class="tag">${{single:"シングル",box:"ボックス",set:"セット"}[a.type]}</span>
        ${a.shrink ? `<span class="tag">シュリンク${a.shrink}</span>` : ""}
        ${a.cert ? `<span class="tag">認定 ${a.cert}</span>` : ""}
      </div>
      <div class="muted">×${a.qty||1}／購入 ${yen((a.buy||0)*(a.qty||1))}${a.date ? "（"+a.date+"）" : ""}</div>
      <div class="row"><span class="grow">${v == null ? "価格未取得" : "評価 " + yen(v)}</span>
      ${d == null ? "" : `<span class="${d>=0?"plus":"minus"}">${d>=0?"+":""}${yen(d)}</span>`}
      <span class="muted">${p.src}</span></div>
    </div>`;
  }).join("") : "<div class='muted'>該当する品目がありません</div>";
  document.querySelectorAll("[data-del]").forEach(b=> b.addEventListener("click", ()=>{
    if (!confirm("削除しますか？")) return;
    assets = assets.filter(a=>a.id !== b.dataset.del);
    store.set("assets", assets); renderLedger(); renderHome();
  }));
}
["q-type","q-grade","q-pl"].forEach(id=> document.getElementById(id).addEventListener("change", renderLedger));
document.getElementById("q-text").addEventListener("input", renderLedger);

/* ============ 写真から登録（OCRで型番・JANを拾い候補提示） ============ */
let photoDataUrl = "";
function onPhoto(file){
  if (!file) return;
  const rd = new FileReader();
  rd.onload = async ()=>{
    photoDataUrl = rd.result;
    const img = document.getElementById("photo-preview");
    img.src = photoDataUrl; img.classList.remove("hidden");
    const st = document.getElementById("ocr-status");
    st.textContent = "文字を読み取っています…（型番・JANを探します）";
    let text = "";
    try{
      const res = await Tesseract.recognize(photoDataUrl, "eng+jpn");
      text = res.data.text || "";
    }catch(e){ st.textContent = "読み取りに失敗しました。検索・手入力で登録できます。"; return; }
    const nums = text.match(/\d{2,3}\s?\/\s?\d{2,3}/g) || [];
    const jans = text.match(/49\d{11}/g) || [];
    const cands = masterAll().filter(m =>
      (m.number && nums.some(n => n.replace(/\s/g,"") === m.number.replace(/\s/g,""))) ||
      (m.jan && jans.includes(String(m.jan))) ||
      (m.name && text.includes(m.name.slice(0,4)))
    );
    st.textContent = cands.length ? "候補が見つかりました。タップで確定してください。" : "候補が見つかりませんでした。検索・手入力で登録できます。";
    document.getElementById("candidates").innerHTML = cands.map(m =>
      `<button class="cand" data-cand="${m.id}">✔ ${m.name}${m.number ? "（"+m.number+"）" : ""}</button>`).join("");
    document.querySelectorAll("[data-cand]").forEach(b=> b.addEventListener("click", ()=>{
      const sel = document.getElementById("f-master");
      document.getElementById("f-master-search").value = "";
      fillMaster(); sel.value = b.dataset.cand;
      sel.dispatchEvent(new Event("change"));
      document.getElementById("candidates").innerHTML = "";
      st.textContent = "フォームに反映しました。個数・購入価格を入れて「台帳に追加」を押してください。";
    }));
  };
  rd.readAsDataURL(file);
}
document.getElementById("btn-camera").addEventListener("click", ()=> document.getElementById("file-camera").click());
document.getElementById("btn-library").addEventListener("click", ()=> document.getElementById("file-library").click());
document.getElementById("file-camera").addEventListener("change", e=> onPhoto(e.target.files[0]));
document.getElementById("file-library").addEventListener("change", e=> onPhoto(e.target.files[0]));

/* ============ 抽選 ============ */
function fillAreas(){
  const lo = document.getElementById("lot-area"), my = document.getElementById("my-area");
  lo.innerHTML = '<option value="">すべてのエリア</option>' + AREAS.map(a=>`<option>${a}</option>`).join("");
  my.innerHTML = '<option value="">未設定</option>' + AREAS.map(a=>`<option ${a===myArea?"selected":""}>${a}</option>`).join("");
}
document.getElementById("lot-area").addEventListener("change", renderLotteries);
document.getElementById("my-area").addEventListener("change", e=>{ myArea = e.target.value; store.set("myArea", myArea); renderLotteries(); });
const LOT_STATUS = ["未応募","応募済み","当選","落選"];
function renderLotteries(){
  const area = document.getElementById("lot-area").value;
  const now = Date.now();
  const list = LOTTERIES.filter(l => !area || l.area === area || l.area === "全国")
    .sort((a,b)=>{
      const am = myArea && a.area === myArea ? 0 : 1, bm = myArea && b.area === myArea ? 0 : 1;
      if (am !== bm) return am - bm;
      const ae = a.apply_end ? new Date(a.apply_end).getTime() : Infinity;
      const be = b.apply_end ? new Date(b.apply_end).getTime() : Infinity;
      return ae - be;
    });
  document.getElementById("lottery-list").innerHTML = list.length ? list.map(l=>{
    const st = lotState[l.id] || "未応募";
    const open = l.apply_end && new Date(l.apply_end).getTime() > now && (!l.apply_start || new Date(l.apply_start).getTime() <= now);
    return `<div class="item">
      <div style="font-weight:700">${l.shop}</div>
      <div>${l.product}</div>
      <div class="muted">${l.area}／${l.apply_start ? fmtDT(l.apply_start)+"〜" : ""}${l.apply_end ? fmtDT(l.apply_end)+"締切（"+remain(l.apply_end)+"）" : "期間未定"}${l.result_date ? "／結果 "+l.result_date : ""}</div>
      ${l.conditions ? `<div class="muted">条件: ${l.conditions}</div>` : ""}
      <div class="row" style="margin-top:6px">
        ${l.url ? `<a href="${l.url}" target="_blank" rel="noopener">${open ? "応募ページへ" : "公式ページ"}</a>` : ""}
        <span class="grow"></span>
        <select data-lot="${l.id}" style="width:auto; margin:0; padding:6px">
          ${LOT_STATUS.map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}
        </select>
      </div>
    </div>`;
  }).join("") : "<div class='muted'>該当する抽選はありません</div>";
  document.querySelectorAll("[data-lot]").forEach(s=> s.addEventListener("change", ()=>{
    lotState[s.dataset.lot] = s.value; store.set("lottery", lotState);
  }));
}

/* ============ バラパック ============ */
function renderPacks(){
  document.getElementById("pack-list").innerHTML = MASTER.packs.length ? MASTER.packs.map(p=>{
    const c = packCnt[p.id] || 0;
    return `<div class="item row">
      <span class="grow" style="font-weight:700">${p.name}</span>
      <button class="count-btn" data-pack="${p.id}" data-d="-1">−</button>
      <span style="min-width:44px; text-align:center; font-size:18px; font-weight:800">${c}</span>
      <button class="count-btn" data-pack="${p.id}" data-d="1">＋</button>
    </div>`;
  }).join("") : "<div class='muted'>パックのマスターがまだありません</div>";
  document.querySelectorAll("[data-pack]").forEach(b=> b.addEventListener("click", ()=>{
    const id = b.dataset.pack;
    packCnt[id] = Math.max(0, (packCnt[id]||0) + Number(b.dataset.d));
    store.set("packs", packCnt); renderPacks();
  }));
}

/* ============ 初期化 ============ */
(async ()=>{
  await loadData();
  fillMaster(); fillAreas();
  takeSnapshot();
  renderHome(); renderLedger(); renderLotteries(); renderPacks();
})();
</script>
